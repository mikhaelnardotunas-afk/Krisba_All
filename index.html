<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Portal aplikasi sekolah SMP Kristen Basaan">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Krisba">
<title>Portal SMP Kristen Basaan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets-landing/ikon-192.png">
<link rel="apple-touch-icon" href="assets-landing/ikon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Gaya "Windows Phone 8": latar hitam, ubin (tile) datar berwarna aksen,
   live tile yang berbalik, animasi turnstile, app bar bulat di bawah.
   ===================================================================== */
:root{--a:#00abec;--bar:#1f1f1f;--sub:#9a9a9a;--u:52px;--g:7px;--p:9px}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'Segoe WP','Segoe UI','Open Sans',system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
@media (min-width:600px){.wrap{padding:0 24px}:root{--g:10px}}

/* ---------- status bar ---------- */
.sb{display:flex;align-items:center;justify-content:space-between;padding-top:calc(env(safe-area-inset-top) + 8px);min-height:52px;font-size:13px}
.sb .on{display:inline-flex;align-items:center;gap:6px;color:#fff}
.sb .on svg{width:17px;height:17px}
.sb .on.off{color:#ff5b5b}
.sb .jam{font-size:26px;font-weight:300;letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* ---------- layar ---------- */
#layar{transform-origin:0 50%;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.keluar #layar{animation:keluar .24s ease-in forwards}
@keyframes keluar{from{transform:perspective(1400px)}to{opacity:0;transform:perspective(1400px) rotateY(70deg)}}
#semua{display:none}
body.mode-semua #start{display:none}
body.mode-semua #semua{display:block}

/* ---------- grid ubin ---------- */
#ubin{--cols:6;display:grid;grid-template-columns:repeat(var(--cols),var(--u));grid-auto-rows:var(--u);gap:var(--g);grid-auto-flow:row dense;margin-top:14px;perspective:1600px}
@media (min-width:600px){#ubin{--cols:8}}
@media (min-width:1024px){#ubin{--cols:12}}
#ubin>*{animation:masuk .6s cubic-bezier(.1,.9,.2,1) both;animation-delay:var(--d,0ms);transform-origin:0 50%}
@keyframes masuk{from{opacity:0;transform:rotateY(-80deg) translateX(-14px)}to{opacity:1;transform:none}}
.W{grid-column:span 4;grid-row:span 2}
.M,.kl{grid-column:span 2;grid-row:span 2}
.kl{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--g)}

.tile{position:relative;display:block;border:0;padding:0;margin:0;background:none;text-align:left;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .14s ease-out}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.5,0,.2,1)}
.balik .flip{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;overflow:hidden;background:var(--t,var(--a));color:var(--f,#fff);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateX(180deg)}

.lbl{position:absolute;left:var(--p);right:var(--p);bottom:calc(var(--p)*.75);font-size:clamp(11.5px,calc(var(--u)*.24),15px);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{position:absolute;inset:0 0 calc(var(--u)*.38) 0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.1)}
.ico svg{width:calc(var(--u)*.82);height:calc(var(--u)*.82)}
.ico.n svg{width:calc(var(--u)*.6);height:calc(var(--u)*.6)}
.ico b{font-weight:300;font-size:calc(var(--u)*.8);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ico b.pjg{font-size:calc(var(--u)*.4)}
.S .ico{bottom:calc(var(--u)*.34)}
.S .ico svg{width:calc(var(--u)*.42);height:calc(var(--u)*.42)}
.S .lbl{white-space:normal;font-size:clamp(9px,calc(var(--u)*.17),11.5px);line-height:1.08;left:5px;right:3px;bottom:4px;max-height:2.2em}
.ket{position:absolute;left:var(--p);right:var(--p);top:calc(var(--p)*.8);font-size:clamp(11.5px,calc(var(--u)*.235),15px);line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden}
.W .ket{-webkit-line-clamp:3;font-size:clamp(13px,calc(var(--u)*.28),19px);font-weight:300}
.judul{position:absolute;left:var(--p);right:var(--p);top:calc(var(--p)*.55);font-size:clamp(17px,calc(var(--u)*.44),34px);font-weight:300;line-height:1.1;letter-spacing:-.01em}
.lencana{position:absolute;right:var(--p);top:calc(var(--p)*.7);font-size:11px;font-weight:600;background:#fff;color:#000;padding:1px 6px;display:none}
.ada-baru .lencana{display:block}

/* ubin sekolah (gaya Calendar) */
.sek .teks{position:absolute;left:var(--p);right:var(--p);top:calc(var(--p)*.7);font-size:clamp(11.5px,calc(var(--u)*.25),17px);font-weight:600;line-height:1.28}
.sek .teks span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sek .lbl{right:45%}
.tgl{position:absolute;right:var(--p);bottom:calc(var(--p)*.3);display:flex;align-items:baseline;gap:7px}
.tgl span{font-size:clamp(11.5px,calc(var(--u)*.26),16px)}
.tgl b{font-size:calc(var(--u)*.92);font-weight:400;line-height:1;letter-spacing:-.04em}
.logos{position:absolute;inset:0 0 calc(var(--u)*.4) 0;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.35)}
.logos i{width:calc(var(--u)*1.15);height:calc(var(--u)*1.15);border-radius:50%;background:#fff;display:grid;place-items:center}
.logos img{width:80%;height:80%;object-fit:contain}

.ke-semua{display:flex;justify-content:flex-end;margin-top:18px}
.bulat{width:42px;height:42px;border:2px solid #fff;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.bulat svg{width:20px;height:20px}
.bulat:active{background:#fff;color:#000}

/* ---------- daftar semua aplikasi (gaya app list / pivot) ---------- */
.pv-app{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.pv-judul{font-size:clamp(42px,12vw,64px);font-weight:300;line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
.kotak-cari{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.kotak-cari input{flex:1;min-width:0;font:inherit;font-size:17px;color:#000;background:#d6d6d6;border:2px solid #d6d6d6;border-radius:0;padding:7px 10px;outline:none;-webkit-appearance:none;appearance:none}
.kotak-cari input:focus{background:#fff;border-color:var(--a)}
.isi-daftar{columns:1}
@media (min-width:900px){.isi-daftar{columns:2;column-gap:48px}}
.grp{break-inside:avoid;padding-bottom:4px;animation:masuk .5s cubic-bezier(.1,.9,.2,1) both;animation-delay:var(--d,0ms);transform-origin:0 50%}
.huruf{width:50px;height:50px;background:var(--a);font-size:30px;font-weight:300;line-height:1;display:flex;align-items:flex-end;padding:0 0 4px 6px;margin:18px 0 8px;text-transform:lowercase}
.item{display:flex;align-items:center;gap:14px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.item:active{opacity:.6}
.item i{width:50px;height:50px;flex:none;background:var(--t,var(--a));color:var(--f,#fff);display:grid;place-items:center}
.item i svg{width:28px;height:28px}
.item b{display:block;font-size:20px;font-weight:300;line-height:1.2}
.item small{display:block;color:var(--sub);font-size:13px}
.kosong{display:none;color:var(--sub);font-size:17px;font-weight:300;padding:24px 0}

/* ---------- app bar ---------- */
.ab{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar);padding-bottom:env(safe-area-inset-bottom)}
.ab .baris{position:relative;display:flex;justify-content:center;gap:clamp(18px,7vw,44px);padding:8px 52px 6px}
.ab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;font-size:11.5px;min-width:56px;-webkit-tap-highlight-color:transparent}
.ab-btn i{width:40px;height:40px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center}
.ab-btn svg{width:19px;height:19px}
.ab-btn:active i{background:#fff;color:#000}
.ab-btn.sorot i{background:var(--a);border-color:var(--a)}
.ab-btn.putar svg{animation:putar 1s linear infinite}
.ab-btn:disabled{opacity:.55;cursor:default}
@keyframes putar{to{transform:rotate(360deg)}}
.ab .titik{position:absolute;right:8px;top:2px;background:none;border:0;cursor:pointer;padding:8px 12px;font-size:20px;letter-spacing:2px;line-height:1}
.ab .menu{display:none;padding:2px 0 10px}
.ab.buka .menu{display:block}
.ab .menu button{display:block;width:100%;max-width:1180px;margin:0 auto;text-align:left;background:none;border:0;cursor:pointer;font-size:19px;font-weight:300;padding:9px 24px}
.ab .menu button:active{color:var(--a)}

/* ---------- toast & dialog ---------- */
.toast{position:fixed;left:0;right:0;top:0;z-index:60;background:var(--a);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;gap:10px;align-items:center;font-size:14px;transform:translateY(-105%);transition:transform .32s cubic-bezier(.1,.9,.2,1)}
.toast.tampil{transform:none}
.toast img{width:22px;height:22px}
.toast b{font-weight:600;white-space:nowrap}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.7);display:none}
.dlg.tampil{display:block}
.dlg .kotak{background:var(--bar);padding:calc(env(safe-area-inset-top) + 22px) 22px 24px;animation:turun .3s cubic-bezier(.1,.9,.2,1)}
.dlg .dalam{max-width:640px;margin:0 auto}
@keyframes turun{from{transform:translateY(-30px);opacity:0}}
.dlg h3{margin:0 0 10px;font-size:24px;font-weight:600;line-height:1.2}
.dlg .isi{font-size:16px;line-height:1.5;color:#e4e4e4}
.dlg .isi ol{padding-left:22px;margin:8px 0}
.dlg .tb{display:flex;gap:12px;margin-top:22px}
.wbtn{flex:1;border:2px solid #fff;background:none;font-size:15px;font-weight:600;padding:9px 12px;cursor:pointer}
.wbtn:active{background:var(--a);border-color:var(--a)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.sw button{aspect-ratio:1;border:0;cursor:pointer;padding:0}
.sw button.aktif{outline:3px solid #fff;outline-offset:-3px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="layar">
  <div class="wrap">
    <div class="sb">
      <span class="on" id="online"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01" stroke-width="3"/></svg><span>Online</span></span>
      <span class="jam" id="jam" title="Waktu Indonesia Tengah">--:--</span>
    </div>

    <section id="start" aria-label="Layar utama">
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Portal SMP Kristen Basaan</h1>
      <div id="ubin"></div>
      <div class="ke-semua"><button class="bulat" type="button" data-aksi="semua" aria-label="Semua aplikasi" title="Semua aplikasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </section>

    <section id="semua" aria-label="Semua aplikasi">
      <div class="pv-app">SMP Kristen Basaan</div>
      <h2 class="pv-judul">aplikasi</h2>
      <div class="kotak-cari">
        <button class="bulat" type="button" data-aksi="kembali" aria-label="Kembali" title="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <input id="cari" type="search" placeholder="cari aplikasi" aria-label="Cari aplikasi" autocomplete="off">
      </div>
      <div class="isi-daftar" id="isiDaftar"></div>
      <div class="kosong" id="kosong">Aplikasi tidak ditemukan.</div>
    </section>
  </div>
</div>

<nav class="ab" id="ab" aria-label="Menu portal">
  <div class="baris">
    <button class="ab-btn" type="button" data-aksi="cari"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></i><span>cari</span></button>
    <button class="ab-btn" type="button" data-aksi="pasang" id="abPasang"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 6.5v7.5M9 11l3 3 3-3M10 18.5h4"/></svg></i><span data-lbl="pasang">pasang</span></button>
    <button class="ab-btn" type="button" data-aksi="perbarui" id="abPerbarui"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></i><span>perbarui</span></button>
    <button class="titik" type="button" data-aksi="menu" aria-label="Menu lainnya" aria-expanded="false">•••</button>
  </div>
  <div class="menu">
    <button type="button" data-aksi="aksen">warna aksen</button>
    <button type="button" data-aksi="panduan">panduan (PDF)</button>
    <button type="button" data-aksi="tentang">tentang portal</button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"><img src="assets-landing/ikon-192.png" alt=""><span id="toastTxt"></span></div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgJudul"><div class="kotak"><div class="dalam"><h3 id="dlgJudul"></h3><div class="isi" id="dlgIsi"></div><div class="tb" id="dlgTb"></div></div></div></div>

<script>
(function () {

   PENGATURAN PORTAL

  scanWajah: '<path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="11" r="4"/><path d="M7.5 18c1-1.8 2.6-2.7 4.5-2.7s3.5.9 4.5 2.7"/>',

/* ---------------------------------------------------------------- ubin */
function gayaWarna(a) { return (a.warna ? '--t:' + a.warna + ';' : '') + (a.fg ? '--f:' + a.fg + ';' : ''); }
function ubin(tag, attr, uk, depan, belakang, kelas) {
  return '<' + tag + ' class="tile ' + uk + (belakang ? ' live' : '') + (kelas ? ' ' + kelas : '') + '" ' + attr + '><div class="tilt"><div class="flip">' +
    '<div class="face">' + depan + '</div>' + (belakang ? '<div class="face back">' + belakang + '</div>' : '') + '</div></div></' + tag + '>';
}
function ubinApp(id, uk, judul) {
  const a = APP[id], lbl = '<span class="lbl">' + esc(a.pendek || a.nama) + '</span>';
  const depan = judul ? '<div class="judul">' + esc(judul).replace(/\n/g, '<br>') + '</div>' + lbl
                      : '<div class="ico">' + svg(a.ikon, uk === 'S' ? 1.8 : 1.5) + '</div>' + lbl;
  const belakang = uk !== 'S' && a.ket ? '<div class="ket">' + esc(a.ket) + '</div>' + lbl : '';
  return ubin('a', 'href="' + tautan(a.url) + '"' + (a.tabBaru ? ' target="_blank" rel="noopener"' : '') + ' style="' + gayaWarna(a) + '" aria-label="' + esc(a.nama) + '" title="' + esc(a.nama) + '"', uk, depan, belakang);
}
function ubinAksi(aksi, uk, ikon, label, belakang, id) {
  return ubin('button', 'type="button" data-aksi="' + aksi + '"' + (id ? ' id="' + id + '"' : '') + ' aria-label="' + esc(label) + '" title="' + esc(label) + '"', uk,
    '<div class="ico">' + svg(ikon, uk === 'S' ? 1.8 : 1.5) + '</div><span class="lbl" data-lbl="' + aksi + '">' + esc(label) + '</span><span class="lencana">baru</span>', belakang);
}

/* ukuran satu petak = lebar grid dibagi jumlah kolom */
function ukur() {
  const el = $('#ubin'); if (!el.offsetParent) return;
  const cs = getComputedStyle(el), kol = parseInt(cs.getPropertyValue('--cols'), 10) || 6, g = parseFloat(cs.columnGap) || 8;
  el.style.setProperty('--u', Math.max(36, Math.floor((el.clientWidth - (kol - 1) * g) / kol)) + 'px');
}

function wajahStat(tampak) { const t = $('#tStat'), f = t.querySelectorAll('.face'), b = t.classList.contains('balik'); return f[(b ? 1 : 0) ^ (tampak ? 0 : 1)]; }

/* efek miring saat ubin ditekan */
let miring = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  miring = t.querySelector('.tilt');
  miring.style.transform = 'rotateX(' + (-y * 16).toFixed(1) + 'deg) rotateY(' + (x * 16).toFixed(1) + 'deg) scale(.96)';
});
const lepasMiring = () => { if (miring) { miring.style.transform = ''; miring = null; } };
['pointerup', 'pointercancel', 'dragstart'].forEach(ev => document.addEventListener(ev, lepasMiring));
window.addEventListener('scroll', lepasMiring, { passive: true });

/* animasi keluar (turnstile) saat membuka aplikasi */
const kurangGerak = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('click', e => {
  const a = e.target.closest('a.tile, a.item');
  if (!a || a.target === '_blank' || e.defaultPrevented || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button || kurangGerak) return;
  e.preventDefault();
  document.body.classList.add('keluar');

});

function gambarDaftar() {
  const urut = Object.keys(APP).map(k => APP[k]).sort((a, b) => a.nama.localeCompare(b.nama, 'id'));
  const grup = {};
  urut.forEach(a => { const h = a.nama[0].toLowerCase(); (grup[h] = grup[h] || []).push(a); });

      '<i style="' + gayaWarna(a) + '">' + svg(a.ikon, 1.6) + '</i><span><b>' + esc(a.nama) + '</b><small>' + esc(a.kat) + '</small></span></a>').join('') + '</div>').join('');
}
function saring(q) {
  q = q.trim().toLowerCase();
  let ada = 0;
  $$('.item').forEach(el => { const ok = !q || el.dataset.cari.includes(q); el.style.display = ok ? '' : 'none'; if (ok) ada++; });
  $$('.grp').forEach(g => { g.style.display = [...g.querySelectorAll('.item')].some(x => x.style.display !== 'none') ? '' : 'none'; });
  $('#kosong').style.display = ada ? 'none' : 'block';
}
function rute() {
  const semua = location.hash === '#aplikasi';
  document.body.classList.toggle('mode-semua', semua);
  if (semua) { $$('.grp').forEach(g => { g.style.animation = 'none'; void g.offsetWidth; g.style.animation = ''; }); }
  else { ukur(); }
  window.scrollTo(0, 0);
}
function bukaSemua(fokus) {
  if (location.hash !== '#aplikasi') { history.pushState({ semua: 1 }, '', '#aplikasi'); rute(); }
  if (fokus) setTimeout(() => $('#cari').focus(), 60);
}
function kembali() {
  if (history.state && history.state.semua) history.back();
  else { history.replaceState(null, '', location.pathname + location.search); rute(); }
}
window.addEventListener('popstate', rute);

/* geser kiri = semua aplikasi, geser kanan = kembali */
let gx = null, gy = 0, gt = 0;
document.addEventListener('touchstart', e => { if (e.touches.length !== 1) { gx = null; return; } gx = e.touches[0].clientX; gy = e.touches[0].clientY; gt = Date.now(); }, { passive: true });
document.addEventListener('touchend', e => {
  if (gx == null || $('#dlg').classList.contains('tampil')) return;
  const t = e.changedTouches[0], dx = t.clientX - gx, dy = t.clientY - gy; gx = null;
  if (Date.now() - gt > 700 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .6) return;
  const semua = document.body.classList.contains('mode-semua');
  if (dx < 0 && !semua) bukaSemua(false); else if (dx > 0 && semua) kembali();
}, { passive: true });

/* ---------------------------------------------------------------- statistik dari Data Induk */
function tampilStat(d) {
  if (!d) return;
  const n = v => v == null || v === '' ? '—' : v;
  STAT[0].n = n(d.siswaAktif); STAT[1].n = n(d.siswaL) + '/' + n(d.siswaP); STAT[2].n = n(d.guruAktif); STAT[3].n = n(d.jumlahKelas);
  isiStat(wajahStat(true), STAT[iStat]);
  if (d.tahunPelajaran) $('#tp').textContent = 'TP ' + d.tahunPelajaran + (d.semester ? ' · Semester ' + d.semester : '');
}
async function muatStat() {
  try { tampilStat(JSON.parse(ambil('portal_stat') || 'null')); } catch (e) { /* abaikan */ }
  if (!DATA_INDUK_URL || DATA_INDUK_URL.indexOf('PASTE_') === 0 || !navigator.onLine) return;
  try {
    const r = await fetch(DATA_INDUK_URL + '?action=ringkasan&t=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    if (d && d.ok) { tampilStat(d); simpan('portal_stat', JSON.stringify(d)); }
  } catch (e) { /* tetap tampilkan angka terakhir */ }
}

/* ---------------------------------------------------------------- pasang (install) */
let tundaPasang = null;
const diIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const terpasang = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
function uiPasang() {
  const sudah = terpasang();
  $$('[data-lbl="pasang"]').forEach(el => { el.textContent = sudah ? (el.closest('.ab') ? 'terpasang' : 'Terpasang') : (el.closest('.ab') ? 'pasang' : 'Pasang'); });
  $('#abPasang').classList.toggle('sorot', !!tundaPasang && !sudah);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tundaPasang = e; uiPasang(); });
window.addEventListener('appinstalled', () => { tundaPasang = null; uiPasang(); toast('Terpasang', 'Portal sudah ada di layar utama HP.'); });
async function pasang() {
  if (terpasang()) { toast('Sudah terpasang', 'Portal sedang berjalan sebagai aplikasi.'); return; }
  if (tundaPasang) {
    const e = tundaPasang; tundaPasang = null;
    e.prompt();
    try { const p = await e.userChoice; if (p.outcome !== 'accepted') toast('Dibatalkan', 'Portal belum dipasang.'); } catch (x) { /* abaikan */ }
    uiPasang();
    return;
  }
  if (location.protocol === 'file:') {
    dialog('pasang portal', 'Portal sedang dibuka dari file lokal. Buka portal lewat alamat web (https://…) agar bisa dipasang di HP.');
  } else if (diIOS) {
    dialog('pasang di iPhone / iPad', '<ol><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambahkan ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.</li></ol>');
  } else {
    dialog('pasang portal', '<ol><li>Buka menu browser <b>⋮</b> (pojok kanan atas).</li><li>Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</li><li>Ketuk <b>Instal</b>.</li></ol>Disarankan memakai Google Chrome atau Microsoft Edge.');
  }
}

/* ---------------------------------------------------------------- pembaruan otomatis & manual */
let sedangMuatUlang = false, dasarHalaman = null, adaBaru = false, teksStatus = '';
const versiTampil = () => ambil('portal_versi') || '—';
function hashTeks(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function statusPerbarui(teks, baru) {
  teksStatus = teks; adaBaru = !!baru;
  const el = $('#stPerbarui'); if (el) el.textContent = 'Portal versi ' + versiTampil() + '. ' + teks;
  $('#tPerbarui').classList.toggle('ada-baru', adaBaru);
  $('#abPerbarui').classList.toggle('sorot', adaBaru);
}
async function hashServer() {
  const r = await fetch(location.pathname + '?cek=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return hashTeks(await r.text());
}
async function versiServer() {
  const r = await fetch('versi.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).versi;
}
async function cekVersi(otomatis) {
  if (location.protocol === 'file:') { statusPerbarui('Dibuka dari file lokal.'); return false; }
  if (!navigator.onLine) { statusPerbarui('Offline — memakai versi tersimpan.'); return false; }
  try {
    const [v, h] = await Promise.all([versiServer().catch(() => null), hashServer()]);
    if (!dasarHalaman) dasarHalaman = h;                        // isi halaman yang sedang tampil
    const lama = ambil('portal_versi');
    const paksa = !!(v && lama && v !== lama);                 // versi.json diubah → perbarui semua aplikasi
    if (v && !lama) simpan('portal_versi', v);
    const baru = paksa || h !== dasarHalaman;
    const jam = waktuWita(), j = jam.getHours() + '.' + String(jam.getMinutes()).padStart(2, '0');
    statusPerbarui(baru ? 'Versi baru tersedia.' : 'Sudah terbaru · dicek ' + j + '.', baru);
    if (baru && otomatis && !sedangMuatUlang) {
      const token = (v || '') + '|' + h;
      if (sessionStorage.getItem('portal_coba') !== token) {   // cegah muat ulang berulang bila server belum sinkron
        sessionStorage.setItem('portal_coba', token);
        if (v) simpan('portal_versi', v);
        toast('Pembaruan', 'Memuat versi terbaru portal…');
        setTimeout(muatUlangBersih, 1200);
      }
    }
    return baru;
  } catch (e) { statusPerbarui('Tidak bisa memeriksa pembaruan.'); return false; }
}
async function muatUlangBersih() {
  if (sedangMuatUlang) return;
  sedangMuatUlang = true;
  try {
    // hanya cache milik portal yang dibersihkan — cache aplikasi lain (mis. soal ujian offline) tidak disentuh
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.indexOf('portal-') === 0).map(k => caches.delete(k))); }
    // minta setiap aplikasi memeriksa versi barunya (aplikasi sendiri yang memutuskan kapan memakai versi baru)
    if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); }
  } catch (e) { /* abaikan */ }
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}
async function perbaruiManual() {
  const b = $('#abPerbarui');
  if (!navigator.onLine) { toast('Offline', 'Sambungkan internet lalu coba lagi.'); return; }
  b.disabled = true; b.classList.add('putar');
  toast('Memperbarui', 'Memeriksa portal & semua aplikasi…', 8000);
  sessionStorage.removeItem('portal_coba');
  try { const v = await versiServer(); if (v) simpan('portal_versi', v); } catch (e) { /* abaikan */ }
  await muatStat();
  await muatUlangBersih();
}
function tentang() {
  dialog('tentang portal',
    'Portal SMP Kristen Basaan<br>Versi <b>' + esc(versiTampil()) + '</b><br>' + esc(teksStatus) +
    '<br><br>Portal memeriksa pembaruan otomatis setiap 5 menit, saat dibuka kembali, dan saat internet tersambung. ' +
    'Ketuk <b>perbarui</b> untuk memuat ulang portal dan meminta semua aplikasi memeriksa versi terbarunya.' +
    (terpasang() ? '<br><br>Status: terpasang sebagai aplikasi.' : ''),
    [{ t: 'perbarui sekarang', f: perbaruiManual }, { t: 'tutup' }]);
}

/* ---------------------------------------------------------------- tombol */
function tutupMenu() { $('#ab').classList.remove('buka'); $('.ab .titik').setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-aksi]');
  if (!t) { if (!e.target.closest('.ab')) tutupMenu(); return; }
  const aksi = t.dataset.aksi;
  if (aksi !== 'menu') tutupMenu();
  if (aksi === 'menu') { const b = $('#ab').classList.toggle('buka'); t.setAttribute('aria-expanded', String(b)); }
  else if (aksi === 'semua') bukaSemua(false);
  else if (aksi === 'cari') bukaSemua(true);
  else if (aksi === 'kembali') kembali();
  else if (aksi === 'pasang') pasang();
  else if (aksi === 'perbarui') perbaruiManual();
  else if (aksi === 'aksen') pilihAksen();
  else if (aksi === 'panduan') window.open(tautan(APP.panduan.url), '_blank', 'noopener');
  else if (aksi === 'tentang') tentang();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#dlg').classList.contains('tampil')) tutupDialog();
  else if ($('#ab').classList.contains('buka')) tutupMenu();
  else if (document.body.classList.contains('mode-semua')) kembali();
});

/* ---------------------------------------------------------------- mulai */
gambarUbin();
gambarDaftar();
isiStat(wajahStat(true), STAT[0]);
ukur();
window.addEventListener('resize', ukur);
rute();
$('#cari').addEventListener('input', e => saring(e.target.value));
tikJam(); setInterval(tikJam, 10000);
uiPasang();
const mqStandalone = matchMedia('(display-mode: standalone)');
if (mqStandalone.addEventListener) mqStandalone.addEventListener('change', uiPasang);
statusOnline();
window.addEventListener('online', () => { statusOnline(); cekVersi(true); muatStat(); });
window.addEventListener('offline', () => { statusOnline(); statusPerbarui('Offline — memakai versi tersimpan.'); });
muatStat();
setTimeout(() => cekVersi(true), 600);
setInterval(() => cekVersi(true), INTERVAL_CEK);
setInterval(muatStat, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { cekVersi(true); muatStat(); } });
setInterval(() => { if (!document.hidden) putarStat(); }, 4200);
setTimeout(() => setInterval(putarAcak, 2600), 1500);
if (/[?&]v=/.test(location.search)) { history.replaceState(history.state, '', location.pathname + location.hash); setTimeout(() => toast('Selesai', 'Portal sudah versi terbaru.', 2500), 700); }

// service worker portal — scope hanya halaman ini, aplikasi di subfolder TIDAK ikut dikendalikan
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const nama = /\.html?$/i.test(location.pathname) ? location.pathname.split('/').pop() : 'index.html';
  navigator.serviceWorker.register('sw-portal.js', { scope: './' + nama, updateViaCache: 'none' }).catch(() => {});
}
})();
</script>
