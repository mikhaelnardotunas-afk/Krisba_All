<style>
:root{--teks:#eceef1;--redup:#9aa1aa;--kartu:rgba(255,255,255,.055);--garis:rgba(255,255,255,.08);--ikon:clamp(52px,15.5vw,64px)}
*{box-sizing:border-box}
html{background:#17191c}
body{margin:0;min-height:100vh;color:var(--teks);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(130% 55% at 50% 0%,#3b3f47 0%,rgba(59,63,71,0) 65%),linear-gradient(180deg,#2a2d33 0%,#1b1d21 55%,#141518 100%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 18px calc(112px + env(safe-area-inset-bottom))}

/* ---------- atas ---------- */
.atas{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(env(safe-area-inset-top) + 12px);font-size:12.5px;color:var(--redup)}
.atas .kanan{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.on{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.on.off{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.18)}
.kepala{display:flex;align-items:center;gap:12px;margin:20px 0 4px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.logo img{width:80%;height:80%;object-fit:contain}
.kepala .teks{flex:1;min-width:0}
.sapa{font-size:13px;color:var(--redup)}
h1{margin:1px 0 1px;font-size:clamp(22px,6.4vw,30px);line-height:1.15;font-weight:700;letter-spacing:-.015em}
.sub{font-size:13px;color:var(--redup)}
h2{display:flex;align-items:center;gap:8px;margin:28px 0 14px;font-size:15px;font-weight:600;color:#d3d6db}
h2 small{margin-left:auto;font-weight:400;font-size:12px;color:var(--redup)}

/* ---------- ikon aplikasi ---------- */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 4px}
@media (min-width:600px){.apps{grid-template-columns:repeat(6,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;-webkit-tap-highlight-color:transparent;outline:none}
.app span{font-size:12px;line-height:1.25;color:#d9dce0;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ik{position:relative;width:var(--ikon);height:var(--ikon);flex:none;border-radius:28%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--w1,#9aa3ae),var(--w2,#5b6470));box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -4px 8px rgba(0,0,0,.18),0 8px 16px -6px rgba(0,0,0,.65);transition:transform .15s}
.ik::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 50%);pointer-events:none}
.ik svg{width:54%;height:54%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.ik img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.app:active .ik,.dock button:active .ik{transform:scale(.9)}
.app:focus-visible .ik,.dock button:focus-visible .ik{outline:2px solid #fff;outline-offset:3px}
.titik{display:flex;justify-content:center;gap:6px;margin-top:20px}
.titik i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
.titik i:first-child{background:#fff}

/* ---------- informasi ---------- */
.info{display:grid;gap:10px}
@media (min-width:700px){.info{grid-template-columns:1fr 1fr}}
.kartu{display:flex;gap:12px;align-items:flex-start;background:var(--kartu);border:1px solid var(--garis);border-radius:18px;padding:14px 15px}
.kartu.penting{border-color:rgba(255,107,107,.35);background:linear-gradient(135deg,rgba(255,92,92,.12),rgba(255,255,255,.04))}
.kartu .ik{--ikon:38px;border-radius:12px}
.kartu .isi{flex:1;min-width:0}
.kartu h3{margin:0;font-size:15px;line-height:1.3}
.tag{display:inline-block;font-size:10.5px;font-weight:700;background:#e5383b;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.kartu small{display:block;color:var(--redup);font-size:12px;margin-top:1px}
.kartu p{margin:5px 0 0;font-size:13.5px;color:#c6cad0;white-space:pre-line}
.lanjut{display:inline-block;margin-top:7px;color:#7db8ff;font-size:13px;font-weight:600}

/* ---------- video ---------- */
.video{display:grid;grid-auto-flow:column;grid-auto-columns:78%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}
.video::-webkit-scrollbar{display:none}
@media (min-width:700px){.video{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-columns:auto;overflow:visible;margin:0;padding:0}}
.vid{scroll-snap-align:start;display:block;width:100%;text-align:left;padding:0;cursor:pointer;background:var(--kartu);border:1px solid var(--garis);border-radius:18px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.vid .th{position:relative;display:block;aspect-ratio:16/9;background:linear-gradient(150deg,#3a3f48,#23262b)}
.vid .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .main{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.vid .main svg{width:20px;height:20px;margin-left:3px}
.vid b{display:block;padding:10px 12px 0;font-size:13.5px;font-weight:600;line-height:1.35}
.vid small{display:block;padding:2px 12px 0;color:var(--redup);font-size:12px}
.vid::after{content:"";display:block;height:11px}
.vid:active{transform:scale(.98)}
.kosong{color:var(--redup);font-size:13.5px;background:var(--kartu);border:1px dashed rgba(255,255,255,.14);border-radius:18px;padding:18px;text-align:center}

.kaki{margin-top:30px;text-align:center;color:var(--redup);font-size:12px;line-height:1.7}

/* ---------- dock bawah ---------- */
.dock{--ikon:46px;position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(420px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px 7px;border-radius:28px;background:rgba(56,59,66,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer;font-size:10.5px;color:#d9dce0;-webkit-tap-highlight-color:transparent;outline:none}
.dock button.ada::before{content:"";position:absolute;z-index:2;top:-3px;left:calc(50% + 15px);width:12px;height:12px;border-radius:50%;background:#ff3b30;border:2px solid #383b42}
.dock button:disabled{opacity:.6}
.dock .putar svg{animation:putar 1s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}

/* ---------- pesan & jendela ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);z-index:60;transform:translate(-50%,-160%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:calc(100% - 24px);background:rgba(44,47,53,.97);border:1px solid var(--garis);border-radius:16px;padding:10px 16px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.toast.tampil{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.65)}
.modal.tampil{display:flex}
.mbox{width:min(440px,100%);background:#26292e;border:1px solid var(--garis);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:naik .25s ease-out}
@keyframes naik{from{transform:translateY(14px);opacity:0}}
.mbox h3{margin:0 0 8px;font-size:18px}
.mbox .isi{font-size:14.5px;color:#d0d3d8;line-height:1.55}
.mbox ol{margin:6px 0;padding-left:20px}
.tombol{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.tbl{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.1)}
.tbl.utama{background:#3b82f6}
.mbox.lebar{width:min(900px,100%);padding:0;overflow:hidden}
.vframe{aspect-ratio:16/9;background:#000}
.vframe iframe{width:100%;height:100%;border:0;display:block}
.vjudul{display:flex;align-items:center;gap:10px;padding:12px 14px}
.vjudul b{flex:1;font-size:14.5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01" stroke-width="2.4"/>',
  pengumuman: '<path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>',
  kalender: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  rumah: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  foto: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  pesan: '<path d="M4 5h16v11H9l-5 4z"/>',
  uang: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/>',
  piala: '<path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 14v4M8 21h8M9.5 18h5"/>',
  pasang: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M12 6.5v7.5M9 11l3 3 3-3M10 18.5h4"/>',
  perbarui: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  main: '<path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/>'
};

/* =====================================================================
   Kode di bawah ini mengatur cara kerja portal — tidak perlu diubah.
   ===================================================================== */
const INTERVAL_CEK = 5 * 60 * 1000;   // periksa pembaruan tiap 5 menit
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tautan = u => /^(https?:|mailto:|tel:)/i.test(u || '') ? u : encodeURI(u || '#');
const simpan = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* abaikan */ } };
const ambil = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const svg = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IKON[n] || IKON.link) + '</svg>';
function ikon(o, kelas) {
  const w = o.warna || [];
  const gaya = w[0] ? ' style="--w1:' + esc(w[0]) + ';--w2:' + esc(w[1] || w[0]) + '"' : '';
  return '<span class="ik' + (kelas ? ' ' + kelas : '') + '"' + gaya + '>' + (o.gambar ? '<img src="' + esc(tautan(o.gambar)) + '" alt="" loading="lazy">' : svg(o.ikon)) + '</span>';
}
const tabBaru = o => o.tabBaru || /^https?:/i.test(o.link || '') ? ' target="_blank" rel="noopener"' : '';

/* ---------------------------------------------------------------- isi halaman */
function gambarJudul() {
  $('#judul').textContent = PORTAL.judul || '';
  $('#subjudul').textContent = PORTAL.subjudul || '';
  [['#logoKiri', PORTAL.logoKiri], ['#logoKanan', PORTAL.logoKanan]].forEach(([id, src]) => {
    const el = $(id);
    if (src) el.innerHTML = '<img src="' + esc(tautan(src)) + '" alt="Logo">'; else el.style.display = 'none';
  });
}
function gambarAplikasi() {
  $('#apps').innerHTML = APLIKASI.map(a =>
    '<a class="app" href="' + esc(tautan(a.link)) + '"' + tabBaru(a) + ' title="' + esc(a.nama) + '">' + ikon(a) + '<span>' + esc(a.nama) + '</span></a>').join('');
}
function tglIndo(t) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t || '');
  return m ? (+m[3]) + ' ' + BULAN[+m[2] - 1] + ' ' + m[1] : (t || '');
}
function gambarInfo() {
  $('#daftarInfo').innerHTML = INFO.length ? INFO.map(i =>
    '<article class="kartu' + (i.penting ? ' penting' : '') + '">' +
      ikon({ ikon: i.penting ? 'pengumuman' : 'info', warna: i.penting ? ['#ff7a7a', '#db2c2c'] : ['#ffc15a', '#f0781c'] }) +
      '<div class="isi"><h3>' + esc(i.judul) + (i.penting ? '<span class="tag">Penting</span>' : '') + '</h3>' +
      (i.tanggal ? '<small>' + esc(tglIndo(i.tanggal)) + '</small>' : '') +
      (i.isi ? '<p>' + esc(i.isi) + '</p>' : '') +
      (i.link ? '<a class="lanjut" href="' + esc(tautan(i.link)) + '" target="_blank" rel="noopener">' + esc(i.teksLink || 'Selengkapnya') + ' →</a>' : '') +
    '</div></article>').join('') : '<div class="kosong">Belum ada informasi.</div>';
}
function idYoutube(u) {
  const m = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/.exec(u || '');
  return m ? m[1] : null;
}
function gambarVideo() {
  $('#daftarVideo').style.display = VIDEO.length ? '' : 'block';
  $('#daftarVideo').innerHTML = VIDEO.length ? VIDEO.map((v, i) => {
    const id = idYoutube(v.link);
    const sampul = v.gambar ? tautan(v.gambar) : id ? 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg' : '';
    return '<button class="vid" type="button" data-video="' + i + '"><span class="th">' + (sampul ? '<img src="' + esc(sampul) + '" alt="" loading="lazy">' : '') +
      '<span class="main">' + svg('main') + '</span></span><b>' + esc(v.judul) + '</b>' + (v.ket ? '<small>' + esc(v.ket) + '</small>' : '') + '</button>';
  }).join('') : '<div class="kosong" style="grid-column:1/-1">Belum ada video.</div>';
}
function putarVideo(v) {
  const id = idYoutube(v.link);
  if (!id) { window.open(tautan(v.link), '_blank', 'noopener'); return; }
  $('#mbox').className = 'mbox lebar';
  $('#mbox').innerHTML = '<div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0" title="' + esc(v.judul) +
    '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>' +
    '<div class="vjudul"><b>' + esc(v.judul) + '</b><button class="tbl" type="button" data-tutup>Tutup</button></div>';
  $('#modal').classList.add('tampil');
}

/* ---------------------------------------------------------------- pesan & jendela */
function toast(teks, ms) {
  $('#toast').textContent = teks;
  $('#toast').classList.add('tampil');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('#toast').classList.remove('tampil'), ms || 3500);
}
function dialog(judul, isiHtml, tombol) {
  $('#mbox').className = 'mbox';
  $('#mbox').innerHTML = '<h3>' + esc(judul) + '</h3><div class="isi">' + isiHtml + '</div><div class="tombol"></div>';
  (tombol || [{ t: 'OK', utama: true }]).forEach(b => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'tbl' + (b.utama ? ' utama' : ''); el.textContent = b.t;
    el.onclick = () => { tutupModal(); if (b.f) b.f(); };
    $('#mbox .tombol').appendChild(el);
  });
  $('#modal').classList.add('tampil');
}
function tutupModal() { $('#modal').classList.remove('tampil'); $('#mbox').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-tutup]')) tutupModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupModal(); });

/* ---------------------------------------------------------------- jam */
function waktuWita() { const d = new Date(); return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 8 * 3600000); }
function tikJam() {
  const w = waktuWita(), j = w.getHours();
  $('#tanggal').textContent = HARI[w.getDay()] + ', ' + w.getDate() + ' ' + BULAN[w.getMonth()] + ' ' + w.getFullYear();
  $('#jam').textContent = String(j).padStart(2, '0') + '.' + String(w.getMinutes()).padStart(2, '0') + ' WITA';
  $('#sapa').textContent = 'Selamat ' + (j < 4 ? 'malam' : j < 11 ? 'pagi' : j < 15 ? 'siang' : j < 18 ? 'sore' : 'malam');
  $('#tahun').textContent = w.getFullYear();
}
function statusOnline() {
  const on = navigator.onLine;
  $('#online').classList.toggle('off', !on);
  $('#online').title = on ? 'Online' : 'Offline';
}

/* ---------------------------------------------------------------- tombol PASANG (install) */
let tundaPasang = null;
const diIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const terpasang = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
function uiPasang() {
  const sudah = terpasang();
  $('#lblPasang').textContent = sudah ? 'Terpasang' : 'Pasang';
  $('#btnPasang').classList.toggle('ada', !!tundaPasang && !sudah);
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tundaPasang = e; uiPasang(); });
window.addEventListener('appinstalled', () => { tundaPasang = null; uiPasang(); toast('Portal sudah terpasang di layar utama HP.'); });
async function pasang() {
  if (terpasang()) { toast('Portal sudah terpasang sebagai aplikasi.'); return; }
  if (tundaPasang) {
    const e = tundaPasang; tundaPasang = null;
    e.prompt();
    try { const p = await e.userChoice; if (p.outcome !== 'accepted') toast('Pemasangan dibatalkan.'); } catch (x) { /* abaikan */ }
    uiPasang();
    return;
  }
  if (location.protocol === 'file:') dialog('Pasang portal', 'Portal sedang dibuka dari file lokal. Buka lewat alamat web (https://…) agar bisa dipasang di HP.');
  else if (diIOS) dialog('Pasang di iPhone / iPad', '<ol><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas).</li><li>Pilih <b>Tambahkan ke Layar Utama</b>, lalu <b>Tambah</b>.</li></ol>');
  else dialog('Pasang portal', '<ol><li>Buka menu browser <b>⋮</b> (pojok kanan atas).</li><li>Pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.</li><li>Ketuk <b>Instal</b>.</li></ol>Disarankan memakai Google Chrome atau Microsoft Edge.');
}

/* ---------------------------------------------------------------- tombol PERBARUI & pembaruan otomatis
   - Portal membandingkan dirinya dengan index.html di server (tiap 5 menit, saat dibuka
     kembali, dan saat internet tersambung). Bila berbeda → otomatis memuat versi baru.
   - versi.json = "tombol paksa": ubah isinya bila ingin semua HP juga memperbarui
     SELURUH aplikasi 0–9 sekaligus. */
let sedangMuatUlang = false, dasarHalaman = null;
function hashTeks(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function status(teks, baru) {
  $('#status').textContent = 'Versi ' + (ambil('portal_versi') || '—') + ' · ' + teks;
  $('#btnPerbarui').classList.toggle('ada', !!baru);
}
async function hashServer() {
  const r = await fetch(location.pathname + '?cek=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return hashTeks(await r.text());
}
async function versiServer() {
  const r = await fetch('versi.json?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).versi;
}
async function cekVersi(otomatis) {
  if (location.protocol === 'file:') { status('dibuka dari file lokal'); return; }
  if (!navigator.onLine) { status('offline — memakai versi tersimpan'); return; }
  try {
    const [v, h] = await Promise.all([versiServer().catch(() => null), hashServer()]);
    if (!dasarHalaman) dasarHalaman = h;
    const lama = ambil('portal_versi');
    if (v && !lama) simpan('portal_versi', v);
    const baru = !!(v && lama && v !== lama) || h !== dasarHalaman;
    const w = waktuWita();
    status(baru ? 'versi baru tersedia' : 'sudah terbaru (dicek ' + w.getHours() + '.' + String(w.getMinutes()).padStart(2, '0') + ')', baru);
    if (baru && otomatis && !sedangMuatUlang) {
      const token = (v || '') + '|' + h;
      if (sessionStorage.getItem('portal_coba') !== token) {   // cegah muat ulang berulang
        sessionStorage.setItem('portal_coba', token);
        if (v) simpan('portal_versi', v);
        toast('Memuat versi terbaru portal…');
        setTimeout(muatUlangBersih, 1200);
      }
    }
  } catch (e) { status('tidak bisa memeriksa pembaruan'); }
}
async function muatUlangBersih() {
  if (sedangMuatUlang) return;
  sedangMuatUlang = true;
  try {
    // hanya cache milik portal yang dihapus — data aplikasi lain tidak disentuh
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.indexOf('portal-') === 0).map(k => caches.delete(k))); }
    // minta setiap aplikasi memeriksa versi terbarunya
    if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); }
  } catch (e) { /* abaikan */ }
  location.replace(location.pathname + '?v=' + Date.now());
}
async function perbarui() {
  if (!navigator.onLine) { toast('Tidak ada internet. Sambungkan lalu coba lagi.'); return; }
  const b = $('#btnPerbarui');
  b.disabled = true; b.querySelector('.ik').classList.add('putar');
  toast('Memperbarui portal & semua aplikasi…', 8000);
  sessionStorage.removeItem('portal_coba');
  try { const v = await versiServer(); if (v) simpan('portal_versi', v); } catch (e) { /* abaikan */ }
  await muatUlangBersih();
}

/* ---------------------------------------------------------------- tombol */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-video]');
  if (v) { putarVideo(VIDEO[+v.dataset.video]); return; }
  const t = e.target.closest('[data-aksi]');
  if (!t) return;
  const a = t.dataset.aksi;
  if (a === 'info' || a === 'video') document.getElementById(a).scrollIntoView({ behavior: 'smooth', block: 'start' });
  else if (a === 'pasang') pasang();
  else if (a === 'perbarui') perbarui();
});

/* ---------------------------------------------------------------- mulai */
gambarJudul();
gambarAplikasi();
gambarInfo();
gambarVideo();
document.querySelectorAll('[data-ikon]').forEach(el => { el.innerHTML = svg(el.dataset.ikon); });
tikJam(); setInterval(tikJam, 15000);
statusOnline();
uiPasang();
const mq = matchMedia('(display-mode: standalone)');
if (mq.addEventListener) mq.addEventListener('change', uiPasang);
window.addEventListener('online', () => { statusOnline(); cekVersi(true); });
window.addEventListener('offline', () => { statusOnline(); status('offline — memakai versi tersimpan'); });
setTimeout(() => cekVersi(true), 600);
setInterval(() => cekVersi(true), INTERVAL_CEK);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cekVersi(true); });
if (/[?&]v=/.test(location.search)) { history.replaceState(null, '', location.pathname); setTimeout(() => toast('Portal sudah versi terbaru.', 2500), 500); }

// service worker portal — hanya mengendalikan halaman ini, aplikasi 0–9 tidak ikut
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const nama = /\.html?$/i.test(location.pathname) ? location.pathname.split('/').pop() : 'index.html';
  navigator.serviceWorker.register('sw-portal.js', { scope: './' + nama, updateViaCache: 'none' }).catch(() => {});
}
})();
</script>
