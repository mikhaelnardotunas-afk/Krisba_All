<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelas Digital LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ramah, rapi, profesional — alat kerja harian guru dan siswa
   IDEA: buku tulis sekolah — garis biru tinta pulpen, garis margin merah, koreksi pena merah
   PICTURE: aplikasi itu sendiri; di halaman masuk, halaman buku bergaris dengan pena dan nilai
   COLOUR and TYPE: putih kertas, biru tinta #1d3fbb, merah pena koreksi; Plus Jakarta Sans
   LAYOUT: sidebar di laptop/IFP, laci + navigasi bawah di HP, kartu satu kolom di bawah 600px */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6fb,#0e1220);--card:light-dark(#fff,#161b2b);--ink:light-dark(#141828,#e9ebf4);
--mute:light-dark(#5a6078,#9aa1ba);--line:light-dark(#e2e5ee,#262d45);--blue:light-dark(#1d3fbb,#8aa2ff);
--bsoft:light-dark(#e9eeff,#1d2750);--red:light-dark(#d23a26,#ff806d);--rsoft:light-dark(#fdecea,#3a1d1b);
--ok:light-dark(#11804a,#4fd18b);--oksoft:light-dark(#e5f6ec,#14301f);--warn:light-dark(#a86400,#f3b84f);--wsoft:light-dark(#fff3dc,#33280f);
--sh:0 1px 2px rgb(20 24 40/.06),0 4px 14px rgb(20 24 40/.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}h1{font-size:clamp(26px,3.4vw,34px);font-weight:800}h2{font-size:20px;font-weight:700}h3{font-size:16px;font-weight:700}
p{margin:0}a{color:var(--blue)}button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}.btn.pri{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0e1220)}.btn.dan{color:var(--red)}.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.muted{color:var(--mute)}.sm{font-size:14px}.xs{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--bsoft);color:var(--blue);white-space:nowrap}
.tag.ok{background:var(--oksoft);color:var(--ok)}.tag.red{background:var(--rsoft);color:var(--red)}.tag.warn{background:var(--wsoft);color:var(--warn)}.tag.grey{background:var(--line);color:var(--mute)}
.empty{text-align:center;padding:36px 16px;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.paper{background:var(--blue);color:#fff;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;position:relative;overflow:hidden}
.paper svg{width:100%;max-width:520px;height:auto;align-self:center}
.paper h1{font-size:clamp(32px,4.4vw,50px);line-height:1.05}
.lform{display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,64px)}
.lform form{width:100%;max-width:400px}
.demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.demo button{min-height:56px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:13px;line-height:1.25}
.demo b{display:block;font-size:14px}
/* shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.logo{width:40px;height:40px;border-radius:12px;background:var(--blue);display:grid;place-items:center;flex:none}
.brand b{display:block;line-height:1.2}.brand span{font-size:13px;color:var(--mute)}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;border:0;background:none;width:100%;text-align:left;cursor:pointer;font-weight:600;color:var(--mute)}
.nav:hover{background:var(--bg);color:var(--ink)}.nav.on{background:var(--bsoft);color:var(--blue)}
.nav svg,.bnav svg{width:22px;height:22px;flex:none}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--bsoft);color:var(--blue);flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(3vw,16px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.main{padding:22px max(3vw,16px) 100px;max-width:1240px;width:100%}
.ham{display:none}
.bnav{display:none}
.stat b{display:block;font-size:clamp(26px,4vw,34px);font-weight:800;line-height:1.1}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bsoft);color:var(--blue);margin-bottom:10px}
.list{display:flex;flex-direction:column}.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.course{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.course .cv{padding:18px;color:#fff;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;background-image:repeating-linear-gradient(transparent 0 23px,rgb(255 255 255/.16) 23px 24px)}
.course .cb{padding:14px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{border-radius:18px;padding:22px;color:#fff;background-image:repeating-linear-gradient(transparent 0 27px,rgb(255 255 255/.16) 27px 28px);margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tab{flex:none;min-height:46px;padding:0 14px;border:0;background:none;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--blue);border-color:var(--blue)}
.item{display:flex;gap:14px;align-items:flex-start}.item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bsoft);color:var(--blue)}
.body{white-space:pre-wrap;overflow-wrap:anywhere}
.img{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px;display:block}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap;background:var(--bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.cell{min-width:52px;min-height:36px;border:1px dashed var(--line);border-radius:8px;background:none;cursor:pointer;font-weight:700}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgb(10 12 22/.5);display:flex;align-items:center;justify-content:center;padding:16px}
.md{background:var(--card);border-radius:20px;width:100%;max-width:620px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0/.3)}
.md.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.mb{padding:4px 20px 20px;overflow-y:auto}.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.qb{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;margin-top:10px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;font-size:16px}
.opt.on{border-color:var(--blue);background:var(--bsoft)}.opt.ok{border-color:var(--ok);background:var(--oksoft)}.opt.no{border-color:var(--red);background:var(--rsoft)}
.opt i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;flex:none}
.nums{display:flex;flex-wrap:wrap;gap:6px}.nums button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.nums .d{background:var(--blue);color:light-dark(#fff,#0e1220);border-color:var(--blue)}.nums .c{outline:3px solid var(--red)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--sh);max-width:90vw}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.reply{margin:10px 0 0 22px;padding-left:14px;border-left:3px solid var(--line)}
#busy{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgb(10 12 22/.16)}#busy[hidden]{display:none}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--bsoft);border-top-color:var(--blue);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:900px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{position:fixed;left:0;top:0;z-index:70;width:280px;transform:translateX(-105%);transition:transform .2s}
 .side.open{transform:none;box-shadow:0 0 0 100vmax rgb(10 12 22/.45)}
 .ham{display:inline-flex}
 .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
 .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
 .bnav .on{color:var(--blue)}
 .login{grid-template-columns:minmax(0,1fr)}.paper svg{max-width:340px}
}
@media(max-width:600px){
 .main{padding-top:16px}.card{padding:14px}.md{border-radius:18px 18px 0 0;max-height:94vh}.ov{align-items:flex-end;padding:0}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-weight:600}.stack td:empty{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<div id="modal"></div>
<script>
{
const KEY='kelasdigital_lms_v1';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const dl=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const plus=(days,h=23,m=59)=>{const d=new Date();d.setDate(d.getDate()+days);d.setHours(h,m,0,0);return dl(d)};
const now=()=>dl(new Date());
const fmt=d=>d?new Date(d).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fmtD=d=>new Date(d).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const ini=n=>String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const safeImg=u=>/^(data:image\/(png|jpe?g|webp|gif);base64,|https:\/\/)/i.test(u||'')?u:'';
const COLORS=['#1d3fbb','#d23a26','#0f7b6c','#8a4b08','#3d4a5c','#a3146b','#2f6b1f'];

/* ---------- ikon ---------- */
const P={home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',book:'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7',grade:'M4 20V10M10 20V4M16 20v-7M22 20H2',cal:'M4 6h16v15H4zM4 10h16M8 3v5M16 3v5',bell:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 7M19 14a6 6 0 0 1 3 7',set:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.7H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10.3 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',doc:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8',task:'M9 11l3 3 8-8M20 12v8H4V4h11',quiz:'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V15M12 19h.01M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z',chat:'M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z',plus:'M12 5v14M5 12h14',menu:'M4 7h16M4 12h16M4 17h16',out:'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11',x:'M6 6l12 12M18 6L6 18',back:'M15 18l-6-6 6-6',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4',trash:'M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14',link:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1',clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',sync:'M21 12a9 9 0 0 1-15.5 6.3L3 16M3 12a9 9 0 0 1 15.5-6.3L21 8M21 3v5h-5M3 21v-5h5',key:'M14 10a4 4 0 1 0-1.2 2.8L21 21M17 17l2-2'};
const I=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;

/* ---------- koneksi ke backend Spreadsheet ---------- */
const CFG=window.LMS_CONFIG||{};
const ls={get:k=>{try{return localStorage.getItem(KEY+k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(KEY+k):localStorage.setItem(KEY+k,v)}catch(e){}}};
let API=(CFG.API_URL||'').trim()||ls.get('_api')||'';
const EMPTY={sekolah:'',users:[],courses:[],materi:[],tugas:[],kumpul:[],kuis:[],hasil:[],diskusi:[],pengumuman:[],sheetUrl:''};
let db=EMPTY;try{db=JSON.parse(ls.get('_db'))||EMPTY}catch(e){}
let token=ls.get('_tok'),meId=ls.get('_me');
let busyN=0;
function busy(on){busyN+=on?1:-1;let b=$('#busy');if(!b){b=document.createElement('div');b.id='busy';b.innerHTML='<div class="spin" role="status" aria-label="Memproses"></div>';document.body.append(b)}b.hidden=busyN<=0}
async function api(action,data,{quiet=false}={}){
 if(!API)throw new Error('Alamat backend belum diatur.');
 if(!quiet)busy(true);
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...(action==='login'?data:{data})})});
  let j;try{j=await r.json()}catch(e){throw new Error('Balasan server tidak valid. Periksa URL Aplikasi Web & akses "Siapa saja".')}
  if(!j.ok){if(j.error==='SESI_HABIS'){logoutLocal();render();throw new Error('Sesi berakhir, silakan masuk lagi.')}throw new Error(j.error||'Terjadi kesalahan')}
  if(j.db){db=j.db;ls.set('_db',JSON.stringify(db))}
  return j;
 }catch(e){if(e instanceof TypeError)throw new Error('Tidak bisa terhubung ke server. Periksa internet.');throw e}
 finally{if(!quiet)busy(false)}
}
function logoutLocal(){token=meId=null;db=EMPTY;ls.set('_tok',null);ls.set('_me',null);ls.set('_db',null)}
/* jalankan aksi, lalu gambar ulang; kembalikan false bila gagal (modal tetap terbuka) */
async function run(action,data,msg){try{const j=await api(action,data);if(msg||j.pesan)toast(j.pesan||msg);render();return j}catch(e){toast(e.message);return false}}
const S={v:'home',cid:null,tab:'materi',nilaiC:null,uq:'',ur:'semua'};
const me=()=>db.users.find(u=>u.id===meId);
const user=id=>db.users.find(u=>u.id===id)||{nama:'(pengguna dihapus)',role:''};
const course=id=>db.courses.find(c=>c.id===id);
const isG=()=>['guru','admin'].includes(me()?.role);
const myCourses=()=>{const m=me();if(!m)return[];if(m.role==='admin')return db.courses;if(m.role==='guru')return db.courses.filter(c=>c.guruId===m.id);return db.courses.filter(c=>c.siswa.includes(m.id))};
const canEdit=c=>me().role==='admin'||c.guruId===me().id;
const subOf=(tid,sid)=>db.kumpul.find(k=>k.tugasId===tid&&k.siswaId===sid);
const resOf=(qid,sid)=>db.hasil.find(h=>h.kuisId===qid&&h.siswaId===sid);
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;

let tt;function toast(m){clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- modal ---------- */
let mSubmit=null;
function modal(title,body,{ok='Simpan',onOk=null,wide=false,foot=null}={}){
 mSubmit=onOk;
 $('#modal').innerHTML=`<div class="ov" data-a="ovclose"><form class="md ${wide?'wide':''}" id="mform" novalidate><div class="mh"><h2 class="sp">${esc(title)}</h2><button type="button" class="btn ghost sm" data-a="mclose" aria-label="Tutup">${I('x')}</button></div><div class="mb">${body}</div>${foot!==null?foot:onOk?`<div class="mf"><button type="button" class="btn" data-a="mclose">Batal</button><button class="btn pri">${esc(ok)}</button></div>`:''}</form></div>`;
 setTimeout(()=>$('#mform input:not([type=hidden]),#mform textarea')?.focus(),30);
}
const closeM=()=>{$('#modal').innerHTML='';mSubmit=null;stopTimer();QS=null};
function ask(msg,fn,ok='Hapus'){modal('Konfirmasi',`<p style="margin-top:14px">${esc(msg)}</p>`,{ok,onOk:async()=>{await fn();return true}})}
document.addEventListener('submit',async e=>{const F=e.target;if(F.id==='mform'){e.preventDefault();if(!mSubmit||F.dataset.busy)return;F.dataset.busy='1';const fd=Object.fromEntries(new FormData(F));let r;try{r=await mSubmit(fd,F)}catch(err){toast(err.message||String(err));r=false}delete F.dataset.busy;if(r!==false&&F.isConnected){closeM();render()}}else if(F.id==='lform'){e.preventDefault();login()}});

function readImg(file){return new Promise((res,rej)=>{if(!file||!file.size)return res('');if(!/^image\//.test(file.type))return rej('bukan gambar');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

 <div><h1>Belajar, mengajar, dan menilai dalam satu tempat.</h1><p style="opacity:.85;margin-top:12px;max-width:46ch">Materi, tugas, kuis otomatis, nilai, dan diskusi kelas — bisa dibuka dari HP, laptop, maupun IFP.</p></div>
 </section>
 <div class="lform"><form id="lform" autocomplete="on">

 </form></div></div>`;

async function login(){const u=$('#lu').value.trim(),p=$('#lp').value,er=$('#lerr');er.textContent='';const ap=$('#lapi');if(ap&&ap.value.trim()!==API){const v=ap.value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(v)){er.textContent='URL server harus berbentuk https://script.google.com/…/exec';return}API=v;ls.set('_api',v)}if(!API){er.textContent='Isi dulu alamat server.';$('details')?.setAttribute('open','');return}if(!u||!p){er.textContent='Isi nama pengguna dan kata sandi.';return}
 try{const j=await api('login',{username:u,password:p});token=j.token;meId=j.meId;ls.set('_tok',token);ls.set('_me',meId);S.v='home';render();toast('Selamat datang, '+me().nama.split(',')[0])}catch(e){er.textContent=e.message}}

/* ---------- kerangka ---------- */
const NAV={admin:[['home','Beranda','home'],['kelas','Kelas','book'],['pengguna','Pengguna','users'],['nilai','Nilai','grade'],['umum','Pengumuman','bell'],['set','Pengaturan','set']],
 guru:[['home','Beranda','home'],['kelas','Kelas','book'],['nilai','Buku Nilai','grade'],['agenda','Agenda','cal'],['umum','Pengumuman','bell'],['set','Pengaturan','set']],
 siswa:[['home','Beranda','home'],['kelas','Kelas Saya','book'],['nilai','Nilai Saya','grade'],['agenda','Agenda','cal'],['umum','Pengumuman','bell'],['set','Akun','set']]};
const ROLE={admin:'Administrator',guru:'Guru',siswa:'Siswa'};
function render(){
 const m=me();if(!m){$('#app').innerHTML=viewLogin();return}
 const nav=NAV[m.role];const cur=S.v==='course'?'kelas':S.v;
 const title=S.v==='course'?(course(S.cid)?.nama||'Kelas'):(nav.find(n=>n[0]===S.v)||[])[1]||'';
 $('#app').innerHTML=`<div class="shell"><aside class="side" id="side">
  <div class="brand"><div class="logo" style="color:#fff">${I('book',22)}</div><div><b>Kelas Digital</b><span>${esc(db.sekolah)}</span></div></div>
  ${nav.map(([v,l,i])=>`<button class="nav ${cur===v?'on':''}" data-a="go" data-id="${v}">${I(i)}${l}</button>`).join('')}
  <div class="me"><div class="av">${esc(ini(m.nama))}</div><div class="sp"><b class="sm" style="display:block;line-height:1.2">${esc(m.nama)}</b><span class="xs muted">${ROLE[m.role]}${m.kelas?' · '+esc(m.kelas):''}</span></div><button class="btn ghost sm" data-a="logout" aria-label="Keluar" title="Keluar">${I('out')}</button></div>
 </aside>
 <div><header class="top"><button class="btn ghost sm ham" data-a="ham" aria-label="Menu">${I('menu',22)}</button>${S.v==='course'?`<button class="btn ghost sm" data-a="go" data-id="kelas" aria-label="Kembali">${I('back')}</button>`:''}<h2 class="sp" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</h2><button class="btn ghost sm" data-a="refresh" aria-label="Muat ulang data" title="Muat ulang data">${I('sync')}</button><div class="av" title="${esc(m.nama)}">${esc(ini(m.nama))}</div></header>
 <main class="main" id="main">${(V[S.v]||V.home)()}</main></div>
 <nav class="bnav">${nav.slice(0,4).map(([v,l,i])=>`<button class="${cur===v?'on':''}" data-a="go" data-id="${v}">${I(i)}<span>${l.split(' ')[0]}</span></button>`).join('')}<button data-a="ham">${I('menu')}<span>Lainnya</span></button></nav></div>`;
}

/* ---------- tampilan ---------- */
const stat=(ic,n,l)=>`<div class="card stat"><div class="ic">${I(ic)}</div><b>${esc(n)}</b><span class="muted sm">${esc(l)}</span></div>`;
const courseCard=c=>{const g=user(c.guruId);return `<button class="course" data-a="open" data-id="${c.id}"><div class="cv" style="background-color:${esc(c.warna)}"><div><h3 style="font-size:19px">${esc(c.nama)}</h3><span style="opacity:.9;font-size:14px">${esc(c.kelas)}</span></div><span style="font-size:14px;opacity:.95">${esc(g.nama)}</span></div><div class="cb"><span class="tag grey">${c.siswa.length} siswa</span><span class="tag grey">${db.tugas.filter(t=>t.courseId===c.id).length} tugas</span><span class="tag grey">${db.materi.filter(t=>t.courseId===c.id).length} materi</span></div></button>`};
function visibleAnn(){const m=me();const ids=myCourses().map(c=>c.id);return db.pengumuman.filter(p=>m.role==='admin'||!p.courseId||ids.includes(p.courseId)).sort((a,b)=>b.tgl.localeCompare(a.tgl))}
function tugasStatus(t,sid){const k=subOf(t.id,sid);if(k&&k.nilai!=null)return['ok','Nilai '+k.nilai];if(k)return[k.tgl>t.deadline?'warn':'','Dikumpulkan'+(k.tgl>t.deadline?' (terlambat)':'')];return t.deadline<now()?['red','Belum — lewat tenggat']:['grey','Belum dikumpulkan']}

const V={};
V.home=()=>{
 const m=me(),cs=myCourses(),ids=cs.map(c=>c.id),h=new Date().getHours();
 const salam=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
 let stats='',focus='';
 if(m.role==='admin'){
  stats=stat('users',db.users.length,'Pengguna')+stat('edit',db.users.filter(u=>u.role==='guru').length,'Guru')+stat('users',db.users.filter(u=>u.role==='siswa').length,'Siswa')+stat('book',db.courses.length,'Kelas');
  focus=`<div class="card"><h3>Kelas terbaru</h3><div class="list" style="margin-top:8px">${db.courses.slice(-5).reverse().map(c=>`<div class="li"><div class="sp"><b>${esc(c.nama)} — ${esc(c.kelas)}</b><div class="xs muted">${esc(user(c.guruId).nama)} · ${c.siswa.length} siswa</div></div><button class="btn sm" data-a="open" data-id="${c.id}">Buka</button></div>`).join('')||'<p class="muted">Belum ada kelas.</p>'}</div></div>`;
 }else if(m.role==='guru'){
  const tg=db.tugas.filter(t=>ids.includes(t.courseId)),tid=tg.map(t=>t.id);
  const belum=db.kumpul.filter(k=>tid.includes(k.tugasId)&&k.nilai==null);
  stats=stat('book',cs.length,'Kelas diampu')+stat('users',new Set(cs.flatMap(c=>c.siswa)).size,'Siswa')+stat('task',belum.length,'Tugas perlu dinilai')+stat('quiz',db.kuis.filter(q=>ids.includes(q.courseId)&&q.buka).length,'Kuis dibuka');
  focus=`<div class="card"><h3>Perlu dinilai</h3><div class="list" style="margin-top:8px">${belum.slice(0,6).map(k=>{const t=db.tugas.find(x=>x.id===k.tugasId);return `<div class="li"><div class="av">${esc(ini(user(k.siswaId).nama))}</div><div class="sp"><b class="sm">${esc(user(k.siswaId).nama)}</b><div class="xs muted">${esc(t.judul)} · ${fmt(k.tgl)}</div></div><button class="btn sm pri" data-a="grade" data-id="${k.id}">Nilai</button></div>`}).join('')||'<p class="muted" style="padding:10px 0">Semua tugas sudah dinilai. 👍</p>'}</div></div>`;
 }else{
  const tg=db.tugas.filter(t=>ids.includes(t.courseId));
  const todo=tg.filter(t=>!subOf(t.id,m.id)).sort((a,b)=>a.deadline.localeCompare(b.deadline));
  const nil=[...db.kumpul.filter(k=>k.siswaId===m.id&&k.nilai!=null).map(k=>+k.nilai),...db.hasil.filter(x=>x.siswaId===m.id).map(x=>x.skor)];
  const qa=db.kuis.filter(q=>ids.includes(q.courseId)&&q.buka&&!resOf(q.id,m.id));
  stats=stat('book',cs.length,'Kelas diikuti')+stat('task',todo.length,'Tugas belum dikumpul')+stat('quiz',qa.length,'Kuis menunggu')+stat('grade',avg(nil)??'-','Rata-rata nilai');
  focus=`<div class="card"><h3>Yang harus dikerjakan</h3><div class="list" style="margin-top:8px">${[...qa.map(q=>`<div class="li"><div class="item"><div class="ic">${I('quiz')}</div></div><div class="sp"><b class="sm">${esc(q.judul)}</b><div class="xs muted">${esc(course(q.courseId).nama)} · ${q.durasi} menit</div></div><button class="btn sm pri" data-a="startq" data-id="${q.id}">Mulai</button></div>`),...todo.slice(0,6).map(t=>{const late=t.deadline<now();return `<div class="li"><div class="item"><div class="ic">${I('task')}</div></div><div class="sp"><b class="sm">${esc(t.judul)}</b><div class="xs ${late?'':'muted'}" style="${late?'color:var(--red)':''}">${esc(course(t.courseId).nama)} · tenggat ${fmt(t.deadline)}</div></div><button class="btn sm" data-a="submit" data-id="${t.id}">Kerjakan</button></div>`})].join('')||'<p class="muted" style="padding:10px 0">Tidak ada tugas tertunda. Kerja bagus!</p>'}</div></div>`;
 }
 const ann=visibleAnn().slice(0,3);
 return `<div style="margin-bottom:18px"><h1>${salam}, ${esc(m.nama.split(',')[0].split(' ')[0])}</h1><p class="muted" style="margin-top:4px">${fmtD(new Date())}</p></div>
 <div class="grid g4">${stats}</div>
 <div class="grid g2" style="margin-top:14px">${focus}
 <div class="card"><div class="row"><h3 class="sp">Pengumuman</h3><button class="btn ghost sm" data-a="go" data-id="umum">Semua</button></div><div class="list">${ann.map(p=>`<div class="li" style="align-items:flex-start"><div class="item"><div class="ic">${I('bell')}</div></div><div class="sp"><b class="sm">${esc(p.judul)}</b><p class="xs muted">${p.courseId?esc(course(p.courseId)?.nama||''):'Semua'} · ${fmt(p.tgl)}</p><p class="sm" style="margin-top:4px">${esc(p.isi.slice(0,140))}${p.isi.length>140?'…':''}</p></div></div>`).join('')||'<p class="muted">Belum ada pengumuman.</p>'}</div></div></div>
 ${m.role!=='admin'?`<div class="row" style="margin:26px 0 12px"><h2 class="sp">Kelas</h2><button class="btn ghost sm" data-a="go" data-id="kelas">Lihat semua</button></div><div class="grid g2">${cs.slice(0,4).map(courseCard).join('')||'<div class="empty">Belum ada kelas.</div>'}</div>`:''}`;
};

V.kelas=()=>{const m=me(),cs=myCourses();
 return `<div class="row" style="margin-bottom:16px"><div class="sp"><h1>${m.role==='siswa'?'Kelas Saya':'Kelas'}</h1><p class="muted">${cs.length} kelas</p></div>
 ${m.role==='siswa'?`<button class="btn pri" data-a="join">${I('plus')}Gabung kelas</button>`:`<button class="btn pri" data-a="newc">${I('plus')}Buat kelas</button>`}</div>
 <div class="grid g2">${cs.map(courseCard).join('')||`<div class="empty">${m.role==='siswa'?'Belum bergabung ke kelas. Minta kode kelas ke guru, lalu tekan “Gabung kelas”.':'Belum ada kelas. Tekan “Buat kelas” untuk memulai.'}</div>`}</div>`};

V.course=()=>{const c=course(S.cid);if(!c){S.v='kelas';return V.kelas()}
 const g=isG()&&canEdit(c);const tabs=[['materi','Materi'],['tugas','Tugas'],['kuis','Kuis'],['diskusi','Diskusi'],['anggota','Anggota']];if(g)tabs.push(['nilai','Nilai']);
 return `<div class="banner" style="background-color:${esc(c.warna)}"><div class="row" style="align-items:flex-start"><div class="sp"><h1 style="color:#fff">${esc(c.nama)} <span style="font-weight:500;opacity:.85">· ${esc(c.kelas)}</span></h1><p style="opacity:.9;margin-top:6px">${esc(user(c.guruId).nama)}</p><p style="opacity:.85;margin-top:8px;max-width:70ch" class="sm">${esc(c.deskripsi)}</p></div>
 ${g?`<div class="row"><span class="tag" style="background:rgb(255 255 255/.2);color:#fff">Kode: ${esc(c.kode)}</span><button class="btn sm" data-a="editc" data-id="${c.id}">${I('edit',16)}Ubah</button></div>`:''}</div></div>
 <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" role="tab" aria-selected="${S.tab===k}" data-a="tab" data-id="${k}">${l}</button>`).join('')}</div>
 ${(T[S.tab]||T.materi)(c,g)}`};

const T={};
T.materi=(c,g)=>{const l=db.materi.filter(x=>x.courseId===c.id).sort((a,b)=>b.tgl.localeCompare(a.tgl));
 return `${g?`<div class="row" style="margin-bottom:14px"><span class="sp"></span><button class="btn pri" data-a="newm">${I('plus')}Tambah materi</button></div>`:''}
 <div class="grid">${l.map(x=>`<article class="card"><div class="item"><div class="ic">${I('doc')}</div><div class="sp"><div class="row"><h3 class="sp">${esc(x.judul)}</h3>${g?`<button class="btn ghost sm" data-a="editm" data-id="${x.id}" aria-label="Ubah">${I('edit',18)}</button><button class="btn ghost sm dan" data-a="delm" data-id="${x.id}" aria-label="Hapus">${I('trash',18)}</button>`:''}</div><p class="xs muted">${fmt(x.tgl)}</p>
 <details ${l.length<3?'open':''} style="margin-top:8px"><summary class="sm" style="cursor:pointer;color:var(--blue);font-weight:600">Baca materi</summary><p class="body" style="margin-top:10px">${esc(x.isi)}</p>${safeImg(x.img)?`<img class="img" src="${esc(x.img)}" alt="Gambar materi">`:''}${safeUrl(x.link)?`<p style="margin-top:10px"><a href="${esc(x.link)}" target="_blank" rel="noopener" class="btn sm">${I('link',16)}Buka tautan</a> <span class="xs muted" style="overflow-wrap:anywhere">${esc(x.link)}</span></p>`:''}</details></div></div></article>`).join('')||'<div class="empty">Belum ada materi.</div>'}</div>`};

T.tugas=(c,g)=>{const l=db.tugas.filter(x=>x.courseId===c.id).sort((a,b)=>b.deadline.localeCompare(a.deadline));const m=me();
 return `${g?`<div class="row" style="margin-bottom:14px"><span class="sp"></span><button class="btn pri" data-a="newt">${I('plus')}Buat tugas</button></div>`:''}
 <div class="grid">${l.map(t=>{let right='';
  if(g){const sub=db.kumpul.filter(k=>k.tugasId===t.id);const dn=sub.filter(k=>k.nilai!=null).length;right=`<div style="margin-top:12px"><div class="row xs muted"><span class="sp">${sub.length}/${c.siswa.length} dikumpulkan · ${dn} dinilai</span></div><div class="bar" style="margin-top:6px"><i style="width:${c.siswa.length?sub.length/c.siswa.length*100:0}%"></i></div><div class="row" style="margin-top:12px"><button class="btn sm pri" data-a="check" data-id="${t.id}">Periksa jawaban</button><button class="btn sm" data-a="editt" data-id="${t.id}">${I('edit',16)}Ubah</button><button class="btn sm dan" data-a="delt" data-id="${t.id}">${I('trash',16)}Hapus</button></div></div>`}
  else{const [cl,lb]=tugasStatus(t,m.id);const k=subOf(t.id,m.id);right=`<div class="row" style="margin-top:12px"><span class="tag ${cl}">${esc(lb)}</span><span class="sp"></span><button class="btn sm ${k?'':'pri'}" data-a="submit" data-id="${t.id}">${k?'Lihat / ubah':'Kerjakan'}</button></div>${k&&k.feedback?`<p class="sm" style="margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--rsoft);color:var(--red)"><b>Catatan guru:</b> ${esc(k.feedback)}</p>`:''}`}
  return `<article class="card"><div class="item"><div class="ic">${I('task')}</div><div class="sp"><h3>${esc(t.judul)}</h3><p class="xs ${t.deadline<now()?'':'muted'}" style="${t.deadline<now()?'color:var(--red)':''}">${I('clock',13)} Tenggat ${fmt(t.deadline)} · ${t.poin} poin</p><p class="body sm" style="margin-top:8px">${esc(t.instruksi)}</p>${right}</div></div></article>`}).join('')||'<div class="empty">Belum ada tugas.</div>'}</div>`};

T.kuis=(c,g)=>{const l=db.kuis.filter(x=>x.courseId===c.id);const m=me();
 return `${g?`<div class="row" style="margin-bottom:14px"><span class="sp"></span><button class="btn pri" data-a="newq">${I('plus')}Buat kuis</button></div>`:''}
 <div class="grid">${l.map(q=>{let right='';

function gradebook(c){

/* ---------- kuis dikerjakan ---------- */
let QS=null,timerH=null;
function stopTimer(){clearInterval(timerH);timerH=null}
const QK=id=>'_quiz_'+meId+'_'+id;
function persistQ(){if(QS)ls.set(QK(QS.q.id),JSON.stringify({order:QS.order,ans:QS.ans,cur:QS.cur,end:QS.end}))}
function startQuiz(id){const q=db.kuis.find(x=>x.id===id);if(!q||resOf(id,me().id))return;
 let sv=null;try{sv=JSON.parse(ls.get(QK(id)))}catch(e){}
 if(sv&&Array.isArray(sv.order)&&sv.order.length===q.soal.length)QS={q,order:sv.order,ans:sv.ans,cur:sv.cur||0,end:sv.end};
 else{const order=q.soal.map((_,i)=>i);if(q.acak!==false)order.sort(()=>Math.random()-.5);QS={q,order,ans:Array(q.soal.length).fill(null),cur:0,end:Date.now()+q.durasi*60000}}
 persistQ();drawQuiz();timerH=setInterval(()=>{if(!QS)return stopTimer();const left=QS.end-Date.now();const el=$('#qtimer');if(left<=0){finishQuiz(true);return}if(el){const s=Math.ceil(left/1000);el.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;el.style.color=s<60?'var(--red)':''}},500);
}
function drawQuiz(){const {q,order,ans,cur}=QS;const si=order[cur],s=q.soal[si];const s0=Math.ceil((QS.end-Date.now())/1000);
 modal(q.judul,`<div class="row" style="margin-top:12px"><span class="tag">Soal ${cur+1} dari ${order.length}</span><span class="sp"></span>${I('clock',18)}<span id="qtimer" class="timer">${pad(Math.floor(s0/60))}:${pad(s0%60)}</span></div>
 <p style="font-size:18px;font-weight:600;margin-top:16px" class="body">${esc(s.t)}</p>
 ${s.o.map((o,j)=>`<button type="button" class="opt ${ans[si]===j?'on':''}" data-a="qpick" data-id="${j}"><i>${'ABCD'[j]}</i><span>${esc(o)}</span></button>`).join('')}
 <p class="xs muted" style="margin-top:18px">Navigasi soal</p><div class="nums" style="margin-top:6px">${order.map((x,i)=>`<button type="button" class="${ans[x]!=null?'d':''} ${i===cur?'c':''}" data-a="qgo" data-id="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join('')}</div>`,

 $('.ov').dataset.a='';
}
let finishing=false;
async function finishQuiz(auto){if(finishing||!QS)return;finishing=true;stopTimer();const q=QS.q,ans=QS.ans;
 try{const j=await api('quizSubmit',{kuisId:q.id,jawaban:ans});ls.set(QK(q.id),null);closeM();render();const h=j.hasil;
  modal('Kuis selesai',`<div style="text-align:center;padding:20px 0">${auto?'<p class="muted">Waktu habis — jawaban dikirim otomatis.</p>':''}<div style="font-size:64px;font-weight:800;color:${h.skor<75?'var(--red)':'var(--ok)'}">${h.skor}</div><p>${h.benar} dari ${h.total} jawaban benar</p></div>`,{foot:`<div class="mf"><button type="button" class="btn" data-a="mclose">Tutup</button><button type="button" class="btn pri" data-a="qreview" data-id="${esc(q.id)}">Lihat pembahasan</button></div>`});
 }catch(e){if(/sudah|ditutup/i.test(e.message)){ls.set(QK(q.id),null);closeM();render()}toast(e.message+(QS?' — tekan Kumpulkan untuk mencoba lagi.':''))}
 finally{finishing=false}}

 modal('Pembahasan — '+q.judul,`<p class="sm muted" style="margin-top:12px">${esc(user(sid).nama)} · skor <b>${r.skor}</b></p>${q.soal.map((s,i)=>`<div class="qb"><b class="sm">Soal ${i+1}</b><p class="body" style="margin-top:4px">${esc(s.t)}</p>${s.o.map((o,j)=>`<div class="opt ${j===s.k?'ok':r.jawaban[i]===j?'no':''}" style="cursor:default"><i>${'ABCD'[j]}</i><span class="sp">${esc(o)}</span>${j===s.k?'<b class="xs" style="color:var(--ok)">Kunci</b>':r.jawaban[i]===j?'<b class="xs" style="color:var(--red)">Jawabanmu</b>':''}</div>`).join('')}${r.jawaban[i]==null?'<p class="xs" style="color:var(--red);margin-top:6px">Tidak dijawab</p>':''}</div>`).join('')}`,{wide:true,foot:''});
}

A.editu=id=>{const u=user(id);modal('Ubah pengguna',uForm(u),{onOk:f=>uSave(f,u)})};
A.delu=id=>ask('Hapus akun '+user(id).nama+'? Jawaban dan nilainya juga dihapus.',()=>run('delUser',{id},'Akun dihapus'));
A.bulk=()=>modal('Impor siswa massal',`<p class="sm muted" style="margin-top:12px">Tempel dari Excel/Spreadsheet: satu siswa per baris, kolom <b>Nama</b>, <b>Kelas</b>, dan (opsional) <b>Username</b>. Kata sandi awal: <b>siswa123</b>.</p><textarea name="data" style="min-height:200px;margin-top:10px" placeholder="Gracia Sumampouw	VIII B\nHendra Pangemanan	VIII B	hendra"></textarea>`,{ok:'Impor',onOk:f=>{const rows=f.data.split('\n').map(l=>l.split(/\t|;|,/).map(x=>x.trim())).filter(r=>r[0]);if(!rows.length){toast('Belum ada data');return false}return run('bulkUsers',{rows})}});
A.pw=async()=>{const o=$('#np0').value,a=$('#np1').value,b=$('#np2').value;if(a.length<6){toast('Kata sandi baru minimal 6 karakter');return}if(a!==b){toast('Kata sandi baru tidak sama');return}if(await run('changePw',{old:o,baru:a},'Kata sandi diganti')){}};
A.skl=()=>run('setSekolah',{nama:$('#skl').value},'Tersimpan');
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){modal('Salin manual',`<p class="sm muted" style="margin-top:12px">Pilih semua teks di bawah lalu salin.</p><textarea style="min-height:240px;margin-top:10px" readonly>${esc(t)}</textarea>`,{foot:''})}}
A.csv=id=>{const c=course(id);const tg=db.tugas.filter(t=>t.courseId===id).sort((a,b)=>a.deadline.localeCompare(b.deadline)),qz=db.kuis.filter(q=>q.courseId===id);const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
 const rows=[['Nama',...tg.map(t=>t.judul),...qz.map(x=>'Kuis: '+x.judul),'Rata-rata'],...c.siswa.map(user).sort((a,b)=>a.nama.localeCompare(b.nama)).map(s=>{const v=[...tg.map(t=>subOf(t.id,s.id)?.nilai??''),...qz.map(x=>resOf(x.id,s.id)?.skor??'')];return[s.nama,...v,avg(v.filter(x=>x!=='').map(Number))??'']})];
 copy(rows.map(r=>r.map(q).join(',')).join('\n'),'Nilai disalin — tempel ke Excel/Spreadsheet')};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!t.dataset.a)return;const a=A[t.dataset.a];if(a){if(t.tagName==='A')e.preventDefault();a(t.dataset.id,t,e)}});
document.addEventListener('change',e=>{if(e.target.dataset.a==='pickc'){S.nilaiC=e.target.value;render()}if(e.target.id==='ur'){S.ur=e.target.value;render()}});
let qt;document.addEventListener('input',e=>{if(e.target.id==='uq'){clearTimeout(qt);qt=setTimeout(()=>{S.uq=e.target.value;render();const i=$('#uq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!QS&&$('#modal').innerHTML)closeM();if(e.key==='Enter'&&e.target.id?.startsWith('r_')){A.dreply(e.target.id.slice(2))}});
render();
let lastSync=Date.now();
const bg=()=>{if(!token||QS)return;lastSync=Date.now();api('sync',null,{quiet:true}).then(()=>{if(!$('#modal').innerHTML)render()}).catch(e=>toast(e.message))};
if(token)bg();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastSync>60000)bg()});
if(!API&&!CFG.API_URL)console.info('LMS: isi API_URL di config.js');
}
</script>
</body>
</html>
